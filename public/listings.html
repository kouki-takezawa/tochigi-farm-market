<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出品一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <p class="app-title">出品一覧</p>
  <p class="app-tagline">県内の農家から届いた「今買えるもの」を新着順に</p>
</header>

<main class="container" style="padding-top:16px;" id="content">
  <div class="loading">読み込み中...</div>
</main>

<script src="/common.js"></script>
<script>
async function load() {
  const content = document.getElementById("content");
  try {
    const data = await apiFetch("/api/listings");
    render(data.listings || []);
  } catch (e) {
    content.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render(listings) {
  const content = document.getElementById("content");
  if (!listings.length) {
    content.innerHTML = `<div class="empty-state">まだ出品がありません。</div>`;
    return;
  }
  content.innerHTML = `<div style="display:flex;flex-direction:column;">${listings.map(renderRow).join("")}</div>`;
}

function renderRow(l) {
  const thumbStyle = l.image_url ? `style="background-image:url('${escapeHtml(l.image_url)}')"` : "";
  return `
    <a class="listing-card" href="/farmer.html?id=${encodeURIComponent(l.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="thumb" ${thumbStyle}></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(l.title)} ${l.is_special ? `<span class="badge special">わけあり・特価</span>` : ""}</p>
        <p class="comment">${escapeHtml(l.comment)}</p>
        <p class="price">${priceLabel(l.price)}</p>
        <p style="font-size:12px;color:var(--muted);margin:4px 0 0;">${escapeHtml(l.farmer_name)}(${escapeHtml(l.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

initNav("/listings.html");
initBottomNav("/listings.html");
load();
</script>
</body>
</html>
