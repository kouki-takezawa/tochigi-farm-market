<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マップ | 栃木の直売マルシェ</title>
<meta name="description" content="栃木県内の農家を地図から探せます。現在地を許可すると近い順に並び替わります。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  .leaflet-popup-content { font-size: 13px; line-height: 1.7; }
  .leaflet-popup-content a { font-weight: 700; color: #24402d; }
</style>
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/map.html" class="current">マップ</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="wrap">
  <div class="page-head">
    <p class="breadcrumb"><a href="/">ホーム</a> ／ マップ</p>
    <h1>マップから探す</h1>
    <p>現在地または市町村から、近くの農家を探せます。位置情報を許可しなくても市町村から選べます。</p>
  </div>
  <div class="map-toolbar">
    <button id="locate-btn" class="btn primary">現在地から探す</button>
    <select id="municipality-select" aria-label="市町村から選ぶ">
      <option value="">市町村から選ぶ</option>
    </select>
  </div>
  <p id="map-status" class="map-status" aria-live="polite"></p>
</div>

<div id="map"></div>

<div class="wrap">
  <div id="distance-list" class="distance-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/common.js"></script>
<script>
const TOCHIGI_CENTER = [36.5658, 139.8836]; // 栃木県庁付近
const JAPAN_BOUNDS = L.latLngBounds([24, 122], [46, 154]); // 日本全域を覆う範囲。これより外にはパン/ズームアウトできないようにする
let allFarmers = [];
let map;
let markers = [];
let userLatLng = null;

function initMap() {
  map = L.map("map", {
    minZoom: 5,
    maxBounds: JAPAN_BOUNDS,
    maxBoundsViscosity: 1.0, // 境界外へのドラッグを完全に止める
  }).setView(TOCHIGI_CENTER, 10);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    noWrap: true, // 世界地図が横に繰り返し表示されるのを防ぐ
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  addJapanMask();
}

// 日本以外の地域をグレーアウトする。世界を覆う大きな四角の中に、日本の陸地形状を
// 「穴」として複数個開けることで、日本の部分だけ地図がそのまま見える状態にする
// (Leafletのポリゴンは1つ目の座標配列が外周、2つ目以降が穴として扱われる仕様を利用)。
async function addJapanMask() {
  try {
    const res = await fetch("/japan-mask.json");
    const rings = await res.json(); // [[[lat,lng], ...], ...] 日本の陸地(211ポリゴン)
    const worldRing = [
      [-85, -180],
      [-85, 180],
      [85, 180],
      [85, -180],
    ];
    L.polygon([worldRing, ...rings], {
      stroke: false,
      fillColor: "#7a7a72",
      fillOpacity: 0.55,
      interactive: false,
    }).addTo(map);
  } catch (e) {
    // マスク表示に失敗しても地図自体は使えるようにする
  }
}

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLng = ((lng2 - lng1) * Math.PI) / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function load() {
  initMap();
  try {
    const data = await apiFetch("/api/farmers");
    allFarmers = data.farmers || [];
    renderMunicipalitySelect();
    renderMarkers();
    renderList();
  } catch (e) {
    document.getElementById("distance-list").innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function renderMunicipalitySelect() {
  const select = document.getElementById("municipality-select");
  const municipalities = Array.from(new Set(allFarmers.map((f) => f.municipality)));
  select.innerHTML = `<option value="">市町村から選ぶ</option>` + municipalities.map((m) => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
  select.addEventListener("change", () => {
    if (!select.value) return;
    const target = allFarmers.find((f) => f.municipality === select.value && f.lat != null);
    if (target) {
      map.setView([target.lat, target.lng], 12);
    }
    document.getElementById("map-status").textContent = `${select.value}に地図を移動しました`;
    renderList();
  });
}

function renderMarkers() {
  markers.forEach((m) => map.removeLayer(m));
  markers = [];

  const withLocation = allFarmers.filter((f) => f.lat != null && f.lng != null);
  withLocation.forEach((f) => {
    const badges = [];
    if (f.has_listing_today) badges.push("本日出品あり");
    if (f.next_event_date) badges.push(`${formatDateShort(f.next_event_date)} イベント`);

    const marker = L.marker([f.lat, f.lng]).addTo(map);
    marker.bindPopup(`
      <b>${escapeHtml(f.name)}</b><br>
      ${escapeHtml(f.municipality)} ・ ${escapeHtml(f.crops)}<br>
      ${badges.length ? `<span style="color:#a8481f;font-weight:700;">${badges.join(" / ")}</span><br>` : ""}
      <a href="/farmer.html?id=${encodeURIComponent(f.id)}">農家ページを見る →</a>
    `);
    markers.push(marker);
  });

  if (withLocation.length && !userLatLng) {
    const bounds = L.latLngBounds(withLocation.map((f) => [f.lat, f.lng]));
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
  }
}

function renderList() {
  const el = document.getElementById("distance-list");
  const municipalityFilter = document.getElementById("municipality-select").value;

  let list = allFarmers.filter((f) => f.lat != null && f.lng != null);
  if (municipalityFilter) {
    list = list.filter((f) => f.municipality === municipalityFilter);
  }

  if (userLatLng) {
    list = list
      .map((f) => ({ ...f, _distance: haversineKm(userLatLng[0], userLatLng[1], f.lat, f.lng) }))
      .sort((a, b) => a._distance - b._distance);
  }

  const withoutLocation = allFarmers.filter((f) => f.lat == null || f.lng == null);

  if (!list.length && !withoutLocation.length) {
    el.innerHTML = emptyState("表示できる農家がありません。");
    return;
  }

  el.innerHTML =
    list
      .map((f) =>
        farmerCard(f, {
          distanceText: f._distance != null ? `現在地から約${f._distance.toFixed(1)}km` : "",
        })
      )
      .join("") +
    (withoutLocation.length
      ? `<p class="result-count">位置情報が未登録の農家が${withoutLocation.length}軒あります(<a href="/farmers.html">農家一覧</a>でご確認ください)</p>`
      : "");
}

document.getElementById("locate-btn").addEventListener("click", () => {
  const statusEl = document.getElementById("map-status");
  if (!navigator.geolocation) {
    statusEl.textContent = "この端末では現在地取得に対応していません。市町村から選んでください。";
    return;
  }
  statusEl.textContent = "現在地を取得中...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      userLatLng = [pos.coords.latitude, pos.coords.longitude];
      map.setView(userLatLng, 12);
      L.circleMarker(userLatLng, { radius: 8, color: "#33503c", fillColor: "#33503c", fillOpacity: 0.6 })
        .addTo(map)
        .bindPopup("現在地");
      statusEl.textContent = "現在地から近い順に並び替えました";
      renderList();
    },
    () => {
      statusEl.textContent = "位置情報の利用が許可されませんでした。市町村から選んでください。";
    }
  );
});

document.getElementById("distance-list").innerHTML = skeletonCards(3);

initBottomNav("/map.html");
initSiteFooter();
load();
</script>
</body>
</html>
