<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出品一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">農家一覧</a>
    <a href="/listings.html" class="current">出品一覧</a>
    <a href="/events.html">イベント</a>
    <a href="/map.html">マップ</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>出品一覧</h1>
  <p>県内の農家から届いた「今買えるもの」を新着順に</p>
</div>

<div class="search-strip">
  <label class="search-bar">
    <input type="search" id="search-input" placeholder="品目名・農家名・市町村で探す" />
  </label>
</div>
<p class="result-count" id="result-count" aria-live="polite"></p>

<main class="container wide" style="padding-top:16px;" id="content">
  <div class="skeleton-grid"></div>
</main>

<script src="/common.js"></script>
<script>
let allListings = [];
let searchQuery = "";

document.querySelector("#content .skeleton-grid").innerHTML = skeletonCards(6);

async function load() {
  try {
    const data = await apiFetch("/api/listings");
    allListings = data.listings || [];
    render();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render() {
  const content = document.getElementById("content");
  const q = searchQuery;
  const filtered = q
    ? allListings.filter(
        (l) =>
          (l.title || "").toLowerCase().includes(q) ||
          (l.farmer_name || "").toLowerCase().includes(q) ||
          (l.farmer_municipality || "").toLowerCase().includes(q) ||
          (l.comment || "").toLowerCase().includes(q)
      )
    : allListings;

  document.getElementById("result-count").textContent = q ? `「${q}」の検索結果: ${filtered.length}件` : "";

  if (!filtered.length) {
    content.innerHTML = `<div class="empty-state">${q ? "該当する出品が見つかりません。" : "まだ出品がありません。"}</div>`;
    return;
  }
  content.innerHTML = `<div class="list-grid">${filtered.map(renderRow).join("")}</div>`;
}

function renderRow(l) {
  const thumbStyle = l.image_url ? `style="background-image:url('${escapeHtml(l.image_url)}')"` : "";
  return `
    <a class="listing-card" href="/farmer.html?id=${encodeURIComponent(l.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="thumb" role="img" aria-label="${escapeHtml(l.title)}の写真" ${thumbStyle}></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(l.title)} ${l.is_special ? `<span class="badge special">わけあり・特価</span>` : ""}</p>
        <p class="comment">${escapeHtml(l.comment)}</p>
        <p class="price">${priceLabel(l.price)}</p>
        <p style="font-size:12px;color:var(--muted);margin:4px 0 0;">${escapeHtml(l.farmer_name)}(${escapeHtml(l.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

document.getElementById("search-input").addEventListener("input", (ev) => {
  searchQuery = ev.target.value.trim().toLowerCase();
  render();
});

initBottomNav("/listings.html");
load();
</script>
</body>
</html>
