<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>農家ページ | とれたて便</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">とれたて便</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/map.html">マップ</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<main id="page">
  <div class="wrap"><div class="loading">読み込み中...</div></div>
</main>

<script src="/common.js"></script>
<script>
const farmerId = new URLSearchParams(location.search).get("id");

async function load() {
  const page = document.getElementById("page");
  if (!farmerId) {
    page.innerHTML = `<div class="wrap"><div class="error-message">農家IDが指定されていません。</div></div>`;
  } else {
    try {
      render(await apiFetch(`/api/farmers/${encodeURIComponent(farmerId)}`));
    } catch (e) {
      page.innerHTML = `<div class="wrap"><div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div></div>`;
    }
  }
  initSiteFooter();
}

function contactButtons(farmer) {
  const buttons = [];
  const lineUrl = safeUrl(farmer.line_url);
  if (lineUrl) {
    buttons.push(`<a class="btn line" href="${escapeHtml(lineUrl)}" target="_blank" rel="noopener">LINEで連絡する</a>`);
  }
  if (farmer.phone) {
    buttons.push(`<a class="btn phone" href="tel:${encodeURIComponent(farmer.phone)}">電話する</a>`);
  }
  return buttons;
}

let currentFarmerId = null;
let currentReviews = [];
let selectedRating = 0;

function render({ farmer, listings, events, jobs, reviews, review_summary }) {
  const page = document.getElementById("page");
  document.title = `${farmer.name}(${placeLabel(farmer.prefecture, farmer.municipality)}) | とれたて便`;
  currentFarmerId = farmer.id;
  currentReviews = reviews || [];

  const normalEvents = events.filter((e) => e.kind !== "labor");
  const laborEvents = events.filter((e) => e.kind === "labor");
  const buttons = contactButtons(farmer);

  const cover = farmer.cover_image_url
    ? `<img class="farmer-cover" src="${escapeHtml(farmer.cover_image_url)}" alt="${escapeHtml(farmer.name)}の写真" />`
    : "";

  page.innerHTML = `
    ${cover}
    <div class="wrap">
      <div class="farmer-head">
        <p class="breadcrumb" style="margin-top:14px;"><a href="/">ホーム</a> ／ <a href="/farmers.html">農家一覧</a> ／ ${escapeHtml(farmer.name)}</p>
        <div class="farmer-head-inner" ${cover ? "" : 'style="margin-top:8px;"'}>
          ${avatarHtml(farmer.name, "avatar--lg")}
          <h1>${escapeHtml(farmer.name)}</h1>
        </div>
        <div class="farmer-meta">
          <span class="tag">${escapeHtml(placeLabel(farmer.prefecture, farmer.municipality))}</span>
          ${farmer.crops ? `<span class="tag">${escapeHtml(farmer.crops)}</span>` : ""}
          ${listings.length ? `<span class="tag tag--today">出品 ${listings.length}件</span>` : ""}
        </div>
        <div style="margin-top:8px;">${reviewSummaryHtml(review_summary)}</div>
        ${farmer.description ? `<p class="farmer-desc" style="margin-top:12px;">${escapeHtml(farmer.description)}</p>` : ""}
        ${
          buttons.length
            ? `<div class="contact-buttons">${buttons.join("")}</div>
               <p class="field-help">購入・お申し込みは、上の連絡先から農家に直接ご連絡ください。当サイトでは決済・仲介は行いません(発送については出品ごとの「発送も相談可」表示をご確認のうえ、農家に直接ご相談ください)。</p>`
            : `<p class="field-help">この農家の連絡先はまだ登録されていません。</p>`
        }
      </div>

      <section class="farmer-section">
        <h2>今買えるもの<span class="count">${listings.length}件</span></h2>
        ${
          listings.length
            ? `<div class="card-grid">${listings.map((l) => listingCard(l, { hideFarmer: true })).join("")}</div>`
            : emptyState("現在出品はありません。", "次の入荷をお待ちください。")
        }
      </section>

      <section class="farmer-section">
        <h2>イベント<span class="count">${normalEvents.length}件</span></h2>
        ${
          normalEvents.length
            ? `<div class="list-grid">${normalEvents.map((e) => eventCard(e, { hideFarmer: true })).join("")}</div>`
            : emptyState("予定されているイベントはありません。")
        }
      </section>

      ${
        laborEvents.length
          ? `<section class="farmer-section">
               <h2>人手募集<span class="count">${laborEvents.length}件</span></h2>
               <div class="list-grid">${laborEvents.map((e) => eventCard(e, { hideFarmer: true })).join("")}</div>
             </section>`
          : ""
      }

      ${
        jobs && jobs.length
          ? `<section class="farmer-section">
               <h2>バイト・求人<span class="count">${jobs.length}件</span></h2>
               <div class="list-grid">${jobs.map((j) => jobCard(j, { hideFarmer: true })).join("")}</div>
             </section>`
          : ""
      }

      <section class="farmer-section">
        <h2>利用者の評価<span class="count">${currentReviews.length}件</span></h2>
        <div id="review-list" class="review-list">
          ${
            currentReviews.length
              ? currentReviews.map((r) => reviewCard(r)).join("")
              : `<p class="empty-state">まだ評価がありません。購入した方はぜひ最初の評価を残してください。</p>`
          }
        </div>
        <div class="card" style="margin-bottom:0;">
          <h3>評価を投稿する</h3>
          <p class="field-help" style="margin-top:-6px;margin-bottom:12px;">全国の初対面の方同士でも安心して取引できるよう、実際にやり取りした感想を残してください。</p>
          <form id="review-form" class="stack">
            <div>
              <label>評価</label>
              <div class="rating-input" id="rating-input" role="radiogroup" aria-label="評価(1〜5)">
                ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rating="${n}" aria-label="${n}">★</button>`).join("")}
              </div>
            </div>
            <div>
              <label>お名前(任意)</label>
              <input type="text" name="reviewer_name" placeholder="未入力の場合は「匿名」として表示されます" />
            </div>
            <div>
              <label>コメント(任意)</label>
              <textarea name="comment" placeholder="例: 丁寧に梱包していただき、鮮度も良かったです"></textarea>
            </div>
            <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <button type="submit" class="btn primary block">評価を投稿する</button>
          </form>
        </div>
      </section>
    </div>`;

  initReviewForm();

  // スマホでは連絡手段を画面下に固定する。下部タブバーと二重に固定すると
  // 画面が狭くなるため、連絡先がある農家ページではタブバーを出さない
  if (buttons.length) {
    const dock = document.createElement("div");
    dock.className = "contact-dock";
    dock.innerHTML = buttons.join("");
    document.body.appendChild(dock);
    document.body.classList.add("has-contact-dock");
  } else {
    initBottomNav(null);
  }
}

function initReviewForm() {
  selectedRating = 0;
  const ratingInput = document.getElementById("rating-input");
  ratingInput.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedRating = Number(btn.dataset.rating);
      ratingInput.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("is-active", Number(b.dataset.rating) <= selectedRating);
      });
    });
  });

  document.getElementById("review-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!selectedRating) {
      showToast("評価(星の数)を選んでください");
      return;
    }
    const form = ev.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const fd = new FormData(form);
      await apiFetch(`/api/farmers/${encodeURIComponent(currentFarmerId)}/reviews`, {
        method: "POST",
        body: JSON.stringify({
          rating: selectedRating,
          reviewer_name: fd.get("reviewer_name") || "",
          comment: fd.get("comment") || "",
          website: fd.get("website") || "",
        }),
      });
      showToast("評価を投稿しました。ありがとうございます");
      render(await apiFetch(`/api/farmers/${encodeURIComponent(currentFarmerId)}`));
    } catch (e) {
      showToast(e.message);
    } finally {
      submitBtn.disabled = false;
    }
  });
}

load();
</script>
</body>
</html>
