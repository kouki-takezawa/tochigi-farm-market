<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>農家一覧 | 栃木の直売マルシェ</title>
<meta name="description" content="栃木県内で掲載中の農家を、市町村やキーワードで絞り込んで探せます。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/farmers.html" class="current">農家一覧</a>
    <a href="/map.html">マップ</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="wrap">
  <div class="page-head">
    <p class="breadcrumb"><a href="/">ホーム</a> ／ 農家一覧</p>
    <h1>農家一覧</h1>
    <p>栃木県内で掲載中の農家です。出品やイベントの更新が新しい順に並んでいます。</p>
  </div>
</div>

<div class="filter-bar">
  <div class="wrap">
    <form class="hero-search" id="search-form" role="search">
      <label class="search-bar">
        <input type="search" id="search-input" placeholder="農家名・作物・市町村で探す" aria-label="農家名・作物・市町村で探す" />
      </label>
      <button type="submit">探す</button>
    </form>
    <div class="filter-row">
      <span class="filter-label">市町村</span>
      <div class="chip-row chip-row--scroll" id="area-chips"></div>
    </div>
  </div>
</div>

<main class="section">
  <div class="wrap">
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div class="farmer-grid" id="content" style="margin-top:14px;"></div>
  </div>
</main>

<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const state = { q: params.get("q") || "", area: params.get("area") || "" };
let allFarmers = [];

document.getElementById("content").innerHTML = skeletonCards(6);
document.getElementById("search-input").value = state.q;

function renderAreaChips() {
  const areas = Array.from(new Set(allFarmers.map((f) => f.municipality).filter(Boolean))).sort();
  document.getElementById("area-chips").innerHTML = [{ v: "", l: "すべて" }, ...areas.map((a) => ({ v: a, l: a }))]
    .map((a) => `<button type="button" class="chip ${a.v === state.area ? "is-active" : ""}" data-area="${escapeHtml(a.v)}">${escapeHtml(a.l)}</button>`)
    .join("");
  document.querySelectorAll("#area-chips .chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.area = btn.dataset.area;
      renderAreaChips();
      apply();
    });
  });
}

function syncUrl() {
  const next = new URLSearchParams();
  if (state.q) next.set("q", state.q);
  if (state.area) next.set("area", state.area);
  const qs = next.toString();
  history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
}

function apply() {
  syncUrl();
  const q = state.q.toLowerCase();
  const list = allFarmers.filter((f) => {
    if (state.area && f.municipality !== state.area) return false;
    if (!q) return true;
    return [f.name, f.crops, f.municipality].some((v) => (v || "").toLowerCase().includes(q));
  });

  const labels = [state.q ? `「${state.q}」` : "", state.area].filter(Boolean).join(" / ");
  document.getElementById("result-count").textContent = labels
    ? `${labels} の検索結果: ${list.length}軒`
    : `${list.length}軒の農家`;

  const content = document.getElementById("content");
  content.innerHTML = list.length
    ? list.map((f) => farmerCard(f)).join("")
    : emptyState("条件に合う農家が見つかりません。", "市町村の絞り込みを外すと見つかるかもしれません。");
}

async function load() {
  try {
    const data = await apiFetch("/api/farmers");
    allFarmers = data.farmers || [];
    renderAreaChips();
    apply();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

document.getElementById("search-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  state.q = document.getElementById("search-input").value.trim();
  apply();
});
document.getElementById("search-input").addEventListener(
  "input",
  debounce((ev) => {
    state.q = ev.target.value.trim();
    apply();
  })
);

initBottomNav("/farmers.html");
initSiteFooter();
load();
</script>
</body>
</html>
