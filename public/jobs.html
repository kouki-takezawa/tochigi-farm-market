<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>バイト・求人一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/events.html">イベント</a>
    <a href="/map.html">マップ</a>
    <a href="/jobs.html" class="current">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>バイト・求人一覧</h1>
  <p>県内の農家が募集しているアルバイト・お手伝いを新着順に</p>
</div>

<div class="search-strip">
  <label class="search-bar">
    <input type="search" id="search-input" placeholder="仕事内容・農家名・市町村で探す" />
  </label>
</div>
<p class="result-count" id="result-count" aria-live="polite"></p>

<main class="container wide" style="padding-top:16px;" id="content">
  <div class="skeleton-grid"></div>
</main>

<script src="/common.js"></script>
<script>
let allJobs = [];
let searchQuery = "";

document.querySelector("#content .skeleton-grid").innerHTML = skeletonCards(6);

async function load() {
  try {
    const data = await apiFetch("/api/jobs");
    allJobs = data.jobs || [];
    render();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render() {
  const content = document.getElementById("content");
  const q = searchQuery;
  const filtered = q
    ? allJobs.filter(
        (j) =>
          (j.title || "").toLowerCase().includes(q) ||
          (j.farmer_name || "").toLowerCase().includes(q) ||
          (j.farmer_municipality || "").toLowerCase().includes(q) ||
          (j.description || "").toLowerCase().includes(q)
      )
    : allJobs;

  document.getElementById("result-count").textContent = q ? `「${q}」の検索結果: ${filtered.length}件` : "";

  if (!filtered.length) {
    content.innerHTML = `<div class="empty-state">${q ? "該当する求人が見つかりません。" : "募集中のバイト・求人はまだありません。"}</div>`;
    return;
  }
  content.innerHTML = `<div class="list-grid">${filtered.map(renderCard).join("")}</div>`;
}

function renderCard(j) {
  return `
    <a href="/farmer.html?id=${encodeURIComponent(j.farmer_id)}" class="job-card">
      <p class="job-title">${escapeHtml(j.title)}</p>
      <p class="job-wage">${escapeHtml(j.wage)}</p>
      <p class="job-meta">${j.work_date ? escapeHtml(j.work_date) : ""}${j.work_hours ? " ・ " + escapeHtml(j.work_hours) : ""}${j.capacity ? " ・ 募集" + escapeHtml(j.capacity) : ""}</p>
      ${j.description ? `<p class="job-desc">${escapeHtml(j.description)}</p>` : ""}
      <p class="job-farmer">${escapeHtml(j.farmer_name)}(${escapeHtml(j.farmer_municipality)})</p>
    </a>
  `;
}

document.getElementById("search-input").addEventListener("input", (ev) => {
  searchQuery = ev.target.value.trim().toLowerCase();
  render();
});

initBottomNav("/jobs.html");
load();
</script>
</body>
</html>
