<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>イベント一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/events.html" class="current">イベント</a>
    <a href="/map.html">マップ</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>イベント一覧</h1>
  <p>県内の農家で開催予定のイベントを日付順に</p>
</div>

<div class="search-strip">
  <label class="search-bar">
    <input type="search" id="search-input" placeholder="イベント名・農家名・市町村で探す" />
  </label>
</div>
<p class="result-count" id="result-count" aria-live="polite"></p>

<main class="container wide" style="padding-top:16px;" id="content">
  <div class="skeleton-grid"></div>
</main>

<script src="/common.js"></script>
<script>
let allEvents = [];
let searchQuery = "";

document.querySelector("#content .skeleton-grid").innerHTML = skeletonCards(6);

async function load() {
  try {
    const data = await apiFetch("/api/events");
    allEvents = (data.events || []).filter((e) => e.kind !== "labor");
    render();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render() {
  const content = document.getElementById("content");
  const q = searchQuery;
  const filtered = q
    ? allEvents.filter(
        (e) =>
          (e.title || "").toLowerCase().includes(q) ||
          (e.farmer_name || "").toLowerCase().includes(q) ||
          (e.farmer_municipality || "").toLowerCase().includes(q) ||
          (e.location || "").toLowerCase().includes(q)
      )
    : allEvents;

  document.getElementById("result-count").textContent = q ? `「${q}」の検索結果: ${filtered.length}件` : "";

  if (!filtered.length) {
    content.innerHTML = `<div class="empty-state">${q ? "該当するイベントが見つかりません。" : "開催予定のイベントはまだありません。"}</div>`;
    return;
  }
  content.innerHTML = `<div class="list-grid">${filtered.map(renderRow).join("")}</div>`;
}

function renderRow(e) {
  const [, m, d] = e.event_date.split("-");
  return `
    <a class="event-card" href="/farmer.html?id=${encodeURIComponent(e.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="date-box"><span>${parseInt(m, 10)}/${parseInt(d, 10)}</span></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(e.title)}</p>
        <p class="sub">${escapeHtml(formatDateLong(e.event_date))}${e.event_time ? " " + escapeHtml(e.event_time) : ""}${e.location ? " ・ " + escapeHtml(e.location) : ""}${e.fee ? " ・ 参加費" + escapeHtml(e.fee) : ""}</p>
        <p class="desc">${escapeHtml(e.description)}</p>
        <p style="font-size:12px;color:var(--muted);margin:4px 0 0;">${escapeHtml(e.farmer_name)}(${escapeHtml(e.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

document.getElementById("search-input").addEventListener("input", (ev) => {
  searchQuery = ev.target.value.trim().toLowerCase();
  render();
});

initBottomNav("/events.html");
load();
</script>
</body>
</html>
