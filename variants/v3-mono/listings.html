<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出品一覧 | 栃木の直売マルシェ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<nav class="top-nav">
  <a href="/" class="top-nav-brand">TOCHIGI MARCHE</a>
  <div class="top-nav-links">
    <a href="/">INDEX</a>
    <a href="/listings.html" class="active">出品</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">求人</a>
    <a href="/map.html">MAP</a>
    <a href="/seller.html">LOGIN</a>
  </div>
</nav>

<div class="page-header">
  <h1>出品一覧</h1>
  <p>県内の農家から届いた「今買えるもの」を新着順に</p>
</div>

<main class="container" id="content">
  <div class="loading">読み込み中...</div>
</main>

<script src="/common.js"></script>
<script>
async function load() {
  const content = document.getElementById("content");
  try {
    const data = await apiFetch("/api/listings");
    render(data.listings || []);
  } catch (e) {
    content.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render(listings) {
  const content = document.getElementById("content");
  if (!listings.length) {
    content.innerHTML = `<div class="empty-state">まだ出品がありません。</div>`;
    return;
  }
  content.innerHTML = listings.map(renderRow).join("");
}

function renderRow(l) {
  const thumbStyle = l.image_url ? `style="background-image:url('${escapeHtml(l.image_url)}')"` : "";
  return `
    <a class="listing-card" href="/farmer.html?id=${encodeURIComponent(l.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="thumb" ${thumbStyle}>${l.image_url ? "" : "🥬"}</div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(l.title)} ${l.is_special ? `<span class="badge special">わけあり・特価</span>` : ""}</p>
        <p class="comment">${escapeHtml(l.comment)}</p>
        <p class="price">${priceLabel(l.price)}</p>
        <p class="job-farmer" style="margin:4px 0 0;">🌾 ${escapeHtml(l.farmer_name)}(${escapeHtml(l.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

load();
</script>
</body>
</html>
