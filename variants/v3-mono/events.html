<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>イベント一覧 | 栃木の直売マルシェ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<nav class="top-nav">
  <a href="/" class="top-nav-brand">TOCHIGI MARCHE</a>
  <div class="top-nav-links">
    <a href="/">INDEX</a>
    <a href="/listings.html">出品</a>
    <a href="/events.html" class="active">イベント</a>
    <a href="/jobs.html">求人</a>
    <a href="/map.html">MAP</a>
    <a href="/seller.html">LOGIN</a>
  </div>
</nav>

<div class="page-header">
  <h1>イベント一覧</h1>
  <p>県内の農家で開催予定のイベントを日付順に</p>
</div>

<main class="container" id="content">
  <div class="loading">読み込み中...</div>
</main>

<script src="/common.js"></script>
<script>
async function load() {
  const content = document.getElementById("content");
  try {
    const data = await apiFetch("/api/events");
    render((data.events || []).filter((e) => e.kind !== "labor"));
  } catch (e) {
    content.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render(events) {
  const content = document.getElementById("content");
  if (!events.length) {
    content.innerHTML = `<div class="empty-state">開催予定のイベントはまだありません。</div>`;
    return;
  }
  content.innerHTML = events.map(renderRow).join("");
}

function renderRow(e) {
  const [, m, d] = e.event_date.split("-");
  return `
    <a class="event-card" href="/farmer.html?id=${encodeURIComponent(e.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="date-box"><span>${parseInt(m, 10)}/${parseInt(d, 10)}</span></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(e.title)}</p>
        <p class="sub">${escapeHtml(formatDateLong(e.event_date))}${e.event_time ? " " + escapeHtml(e.event_time) : ""}${e.location ? " ・ " + escapeHtml(e.location) : ""}${e.fee ? " ・ 参加費" + escapeHtml(e.fee) : ""}</p>
        <p class="desc">${escapeHtml(e.description)}</p>
        <p class="job-farmer" style="margin:4px 0 0;">🌾 ${escapeHtml(e.farmer_name)}(${escapeHtml(e.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

load();
</script>
</body>
</html>
