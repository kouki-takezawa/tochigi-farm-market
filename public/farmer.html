<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>農家ページ | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="container" style="padding:0" id="page">
  <div class="loading">読み込み中...</div>
</div>

<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const farmerId = params.get("id");

async function load() {
  const page = document.getElementById("page");
  if (!farmerId) {
    page.innerHTML = `<div class="error-message">農家IDが指定されていません。</div>`;
    return;
  }
  try {
    const data = await apiFetch(`/api/farmers/${encodeURIComponent(farmerId)}`);
    render(data);
  } catch (e) {
    page.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render({ farmer, listings, events }) {
  const page = document.getElementById("page");
  document.title = `${farmer.name} | 栃木の直売マルシェ`;

  const coverStyle = farmer.cover_image_url ? `style="background-image:url('${escapeHtml(farmer.cover_image_url)}')"` : "";

  const contactButtons = [];
  if (farmer.line_url) {
    contactButtons.push(`<a class="btn line" href="${escapeHtml(farmer.line_url)}" target="_blank" rel="noopener">LINEで連絡</a>`);
  }
  if (farmer.phone) {
    contactButtons.push(`<a class="btn phone" href="tel:${escapeHtml(farmer.phone)}">電話する</a>`);
  }

  const normalEvents = events.filter((e) => e.kind !== "labor");
  const laborEvents = events.filter((e) => e.kind === "labor");

  page.innerHTML = `
    <a href="/" style="display:block;padding:12px 16px;font-size:13px;color:var(--muted);text-decoration:none;">← 一覧に戻る</a>
    <div class="cover" ${coverStyle}>${farmer.cover_image_url ? "" : "🌾"}</div>
    <div class="farmer-header">
      <h1>${escapeHtml(farmer.name)}</h1>
      <p class="meta">${escapeHtml(farmer.municipality)} ・ ${escapeHtml(farmer.crops)}</p>
      <p class="desc">${escapeHtml(farmer.description)}</p>
      ${contactButtons.length ? `<div class="contact-buttons">${contactButtons.join("")}</div>` : ""}
    </div>

    <section class="section">
      <h2>今買えるもの</h2>
      ${listings.length ? listings.map(renderListing).join("") : `<p class="empty-state" style="padding:12px 0;">現在出品はありません。</p>`}
    </section>

    <section class="section">
      <h2>イベント</h2>
      ${normalEvents.length ? normalEvents.map(renderEvent).join("") : `<p class="empty-state" style="padding:12px 0;">予定されているイベントはありません。</p>`}
    </section>

    ${laborEvents.length ? `
    <section class="section">
      <h2>人手募集</h2>
      ${laborEvents.map(renderEvent).join("")}
    </section>` : ""}

    <p class="footer-note">購入・お申し込みは上記の連絡先から農家に直接ご連絡ください。決済や仲介はサービス側では行いません。</p>
  `;
}

function renderListing(l) {
  const thumbStyle = l.image_url ? `style="background-image:url('${escapeHtml(l.image_url)}')"` : "";
  return `
    <div class="listing-card">
      <div class="thumb" ${thumbStyle}>${l.image_url ? "" : "🥬"}</div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(l.title)} ${l.is_special ? `<span class="badge special">わけあり・特価</span>` : ""}</p>
        <p class="comment">${escapeHtml(l.comment)}</p>
        <p class="price">${priceLabel(l.price)}</p>
      </div>
    </div>
  `;
}

function renderEvent(e) {
  const [, m, d] = e.event_date.split("-");
  return `
    <div class="event-card">
      <div class="date-box"><span>${parseInt(m, 10)}/${parseInt(d, 10)}</span></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(e.title)} ${e.kind === "labor" ? `<span class="badge labor">人手募集</span>` : ""}</p>
        <p class="sub">${escapeHtml(formatDateLong(e.event_date))}${e.event_time ? " " + escapeHtml(e.event_time) : ""}${e.location ? " ・ " + escapeHtml(e.location) : ""}${e.fee ? " ・ 参加費" + escapeHtml(e.fee) : ""}</p>
        <p class="desc">${escapeHtml(e.description)}</p>
      </div>
    </div>
  `;
}

initNav(null);
load();
</script>
</body>
</html>
