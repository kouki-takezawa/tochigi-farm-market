<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>イベント一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <p class="app-title">イベント一覧</p>
  <p class="app-tagline">県内の農家で開催予定のイベントを日付順に</p>
</header>

<main class="container" style="padding-top:16px;" id="content">
  <div class="loading">読み込み中...</div>
</main>

<script src="/common.js"></script>
<script>
async function load() {
  const content = document.getElementById("content");
  try {
    const data = await apiFetch("/api/events");
    render((data.events || []).filter((e) => e.kind !== "labor"));
  } catch (e) {
    content.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function render(events) {
  const content = document.getElementById("content");
  if (!events.length) {
    content.innerHTML = `<div class="empty-state">開催予定のイベントはまだありません。</div>`;
    return;
  }
  content.innerHTML = `<div style="display:flex;flex-direction:column;">${events.map(renderRow).join("")}</div>`;
}

function renderRow(e) {
  const [, m, d] = e.event_date.split("-");
  return `
    <a class="event-card" href="/farmer.html?id=${encodeURIComponent(e.farmer_id)}" style="text-decoration:none;color:inherit;">
      <div class="date-box"><span>${parseInt(m, 10)}/${parseInt(d, 10)}</span></div>
      <div class="info" style="flex:1;">
        <p class="title">${escapeHtml(e.title)}</p>
        <p class="sub">${escapeHtml(formatDateLong(e.event_date))}${e.event_time ? " " + escapeHtml(e.event_time) : ""}${e.location ? " ・ " + escapeHtml(e.location) : ""}${e.fee ? " ・ 参加費" + escapeHtml(e.fee) : ""}</p>
        <p class="desc">${escapeHtml(e.description)}</p>
        <p style="font-size:12px;color:var(--muted);margin:4px 0 0;">🌾 ${escapeHtml(e.farmer_name)}(${escapeHtml(e.farmer_municipality)})</p>
      </div>
    </a>
  `;
}

initNav("/events.html");
initBottomNav("/events.html");
load();
</script>
</body>
</html>
