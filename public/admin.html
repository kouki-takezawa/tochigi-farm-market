<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運営管理 | とれたて便</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">とれたて便</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/map.html">マップ</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>運営管理画面</h1>
  <p>農家の新規登録・管理用URLの発行(運営者専用)</p>
</div>

<div class="container" style="padding-top:16px;">
  <div class="card">
    <h3>管理者シークレット</h3>
    <form id="secret-form" class="stack">
      <input type="password" id="admin-secret" placeholder="Cloudflare Pagesに設定したADMIN_SECRET" />
      <button type="submit" class="btn primary block">保存してログイン</button>
    </form>
  </div>

  <div id="app" style="display:none;">
    <div class="card">
      <h3>新しい農家を登録</h3>
      <form id="create-form" class="stack">
        <div><label>農家名</label><input type="text" name="name" required /></div>
        <div>
          <label>都道府県</label>
          <select name="prefecture" required id="create-prefecture"><option value="">選択してください</option></select>
        </div>
        <div><label>所在地(市町村)</label><input type="text" name="municipality" required placeholder="例: 宇都宮市" /></div>
        <div><label>作っているもの</label><input type="text" name="crops" placeholder="例: トマト・きゅうり" /></div>
        <div><label>紹介文</label><textarea name="description"></textarea></div>
        <div><label>LINE公式URL(任意)</label><input type="url" name="line_url" /></div>
        <div><label>電話番号(任意)</label><input type="tel" name="phone" /></div>
        <div>
          <label>住所(マップのピン用・番地まで入れると精度が上がります)</label>
          <input type="text" name="address" placeholder="例: 栃木県宇都宮市桜1-1-1" />
          <button type="button" id="geocode-btn" class="btn secondary" style="margin-top:6px;">この住所から緯度経度を取得</button>
          <p id="geocode-status" style="font-size:12px;color:var(--ink-2);margin:6px 0 0;"></p>
        </div>
        <div style="display:flex;gap:10px;">
          <div style="flex:1;"><label>緯度(任意)</label><input type="text" name="lat" inputmode="decimal" placeholder="例: 36.5551" /></div>
          <div style="flex:1;"><label>経度(任意)</label><input type="text" name="lng" inputmode="decimal" placeholder="例: 139.8828" /></div>
        </div>
        <button type="submit" class="btn primary block">登録して管理URLを発行</button>
      </form>
      <div id="create-result"></div>
    </div>

    <div class="card">
      <h3>管理URLの再発行</h3>
      <p style="font-size:13px;color:var(--ink-2);">農家IDが分かっている場合、管理用URLを再取得できます(URLを紛失した場合用)。</p>
      <form id="reissue-form" class="stack">
        <input type="text" name="id" placeholder="農家ID(例: farmer-xxxx)" required />
        <button type="submit" class="btn secondary block">管理URLを取得</button>
      </form>
      <div id="reissue-result"></div>
    </div>

    <div class="card">
      <h3>掲載申し込み(セルフ申請)</h3>
      <p style="font-size:13px;color:var(--ink-2);">農家自身が申し込みフォームから登録した申請です。内容を確認し、承認すると管理URLが発行されます。</p>
      <div id="application-list">読み込み中...</div>
      <div id="application-result"></div>
    </div>

    <div class="card">
      <h3>登録済み農家一覧</h3>
      <div id="farmer-list">読み込み中...</div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
function getSecret() { return localStorage.getItem("admin_secret") || ""; }

document.getElementById("secret-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const value = document.getElementById("admin-secret").value.trim();
  if (!value) return;
  localStorage.setItem("admin_secret", value);
  init();
});

async function adminFetch(path, options = {}) {
  return apiFetch(path, {
    ...options,
    headers: { "x-admin-secret": getSecret(), ...(options.headers || {}) },
  });
}

async function init() {
  if (!getSecret()) return;
  document.getElementById("app").style.display = "block";
  document.getElementById("create-prefecture").insertAdjacentHTML("beforeend", prefectureOptionsHtml(""));
  await Promise.all([loadFarmerList(), loadApplicationList()]);
}

const CONTACT_METHOD_LABEL = { line: "LINE", phone: "電話", email: "メール" };

async function loadApplicationList() {
  const el = document.getElementById("application-list");
  try {
    const data = await adminFetch("/api/admin/applications?status=pending");
    const applications = data.applications || [];
    el.innerHTML = applications.length
      ? applications
          .map(
            (a) => `
        <div class="item-row" data-id="${escapeHtml(a.id)}">
          <div>
            <b>${escapeHtml(a.name)}</b><br>
            <span style="font-size:12px;color:var(--ink-2);">
              ${escapeHtml(placeLabel(a.prefecture, a.municipality))} ・ ${escapeHtml(a.crops || "(作物未記入)")}<br>
              連絡先: ${escapeHtml(CONTACT_METHOD_LABEL[a.contact_method] || a.contact_method)} ${escapeHtml(a.contact_value)}
            </span>
            ${a.description ? `<p style="font-size:13px;margin:6px 0 0;">${escapeHtml(a.description)}</p>` : ""}
          </div>
          <div class="actions">
            <button class="btn primary" data-action="approve" data-id="${escapeHtml(a.id)}">承認</button>
            <button class="btn secondary" data-action="reject" data-id="${escapeHtml(a.id)}">却下</button>
          </div>
        </div>`
          )
          .join("")
      : `<p class="empty-state">未処理の申し込みはありません。</p>`;

    el.querySelectorAll('[data-action="approve"]').forEach((btn) => {
      btn.addEventListener("click", () => onDecideApplication(btn.dataset.id, "approve"));
    });
    el.querySelectorAll('[data-action="reject"]').forEach((btn) => {
      btn.addEventListener("click", () => onDecideApplication(btn.dataset.id, "reject"));
    });
  } catch (e) {
    el.innerHTML = `<p class="error-message">${escapeHtml(e.message)}</p>`;
  }
}

async function onDecideApplication(id, action) {
  if (action === "reject" && !confirm("この申し込みを却下しますか？")) return;
  const resultEl = document.getElementById("application-result");
  try {
    const data = await adminFetch(`/api/admin/applications/${encodeURIComponent(id)}`, {
      method: "PUT",
      body: JSON.stringify({ action }),
    });
    if (action === "approve") {
      const fullUrl = `${location.origin}${data.manage_url}`;
      resultEl.innerHTML = `
        <div class="card" style="background:var(--paper-2);margin-top:12px;">
          <p style="font-weight:700;margin:0 0 6px;">承認しました。この管理URLを農家にLINE等で送ってください:</p>
          <p style="word-break:break-all;font-size:13px;">${escapeHtml(fullUrl)}</p>
        </div>`;
    } else {
      showToast("却下しました");
    }
    await Promise.all([loadApplicationList(), loadFarmerList()]);
  } catch (e) {
    showToast(e.message);
  }
}

async function loadFarmerList() {
  const el = document.getElementById("farmer-list");
  try {
    const data = await apiFetch("/api/farmers");
    const farmers = data.farmers || [];
    el.innerHTML = farmers.length
      ? farmers
          .map(
            (f) => `
        <div class="item-row">
          <div><b>${escapeHtml(f.name)}</b><br><span style="font-size:12px;color:var(--ink-2);">${escapeHtml(placeLabel(f.prefecture, f.municipality))} ・ ${escapeHtml(f.id)}</span></div>
          <div class="actions"><button class="btn secondary" data-delete-farmer="${escapeHtml(f.id)}">削除</button></div>
        </div>`
          )
          .join("")
      : `<p class="empty-state">まだ登録農家がいません。</p>`;

    el.querySelectorAll("[data-delete-farmer]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.deleteFarmer;
        if (!confirm(`「${id}」を削除しますか？出品・イベントもすべて削除され、元に戻せません。`)) return;
        try {
          await adminFetch(`/api/admin/farmers/${encodeURIComponent(id)}`, { method: "DELETE" });
          showToast("削除しました");
          await loadFarmerList();
        } catch (e) {
          showToast(e.message);
        }
      });
    });
  } catch (e) {
    el.innerHTML = `<p class="error-message">${escapeHtml(e.message)}</p>`;
  }
}

document.getElementById("geocode-btn").addEventListener("click", async () => {
  const form = document.getElementById("create-form");
  const statusEl = document.getElementById("geocode-status");
  const address = form.address.value.trim() || `${form.prefecture.value}${form.municipality.value.trim()}`;
  if (!address) {
    statusEl.textContent = "住所、または都道府県・市町村を入力してください";
    return;
  }
  statusEl.textContent = "検索中...";
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&limit=1&q=${encodeURIComponent(address)}`;
    const res = await fetch(url);
    const results = await res.json();
    if (!results.length) {
      statusEl.textContent = "見つかりませんでした。住所をより詳しく入力するか、緯度経度を手動で入力してください。";
      return;
    }
    form.lat.value = results[0].lat;
    form.lng.value = results[0].lon;
    statusEl.textContent = `取得しました: ${results[0].display_name}`;
  } catch (e) {
    statusEl.textContent = "取得に失敗しました。緯度経度を手動で入力してください。";
  }
});

document.getElementById("create-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const fd = new FormData(form);
  const resultEl = document.getElementById("create-result");
  resultEl.innerHTML = "";
  try {
    const data = await adminFetch("/api/farmers", {
      method: "POST",
      body: JSON.stringify({
        name: fd.get("name"),
        prefecture: fd.get("prefecture"),
        municipality: fd.get("municipality"),
        crops: fd.get("crops"),
        description: fd.get("description"),
        line_url: fd.get("line_url") || null,
        phone: fd.get("phone") || null,
        lat: fd.get("lat") ? Number(fd.get("lat")) : null,
        lng: fd.get("lng") ? Number(fd.get("lng")) : null,
      }),
    });
    const fullUrl = `${location.origin}${data.manage_url}`;
    resultEl.innerHTML = `
      <div class="card" style="background:var(--paper-2);margin-top:12px;">
        <p style="font-weight:700;margin:0 0 6px;">登録しました。この管理URLを農家にLINE等で送ってください:</p>
        <p style="word-break:break-all;font-size:13px;">${escapeHtml(fullUrl)}</p>
      </div>
    `;
    form.reset();
    await loadFarmerList();
  } catch (e) {
    resultEl.innerHTML = `<p class="error-message">${escapeHtml(e.message)}</p>`;
  }
});

document.getElementById("reissue-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const id = new FormData(form).get("id");
  const resultEl = document.getElementById("reissue-result");
  resultEl.innerHTML = "";
  try {
    const data = await adminFetch(`/api/admin/farmers/${encodeURIComponent(id)}`);
    const fullUrl = `${location.origin}${data.manage_url}`;
    resultEl.innerHTML = `<p style="word-break:break-all;font-size:13px;">${escapeHtml(data.name)} の管理URL:<br>${escapeHtml(fullUrl)}</p>`;
  } catch (e) {
    resultEl.innerHTML = `<p class="error-message">${escapeHtml(e.message)}</p>`;
  }
});

initBottomNav(null);
init();
initSiteFooter();
</script>
</body>
</html>
