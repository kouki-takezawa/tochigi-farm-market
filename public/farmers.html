<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>農家一覧 | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">栃木の直売マルシェ</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/farmers.html" class="current">農家一覧</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/events.html">イベント</a>
    <a href="/map.html">マップ</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>農家一覧</h1>
  <p>栃木県内で登録されている農家を、市町村タブや検索で絞り込んで探せます</p>
</div>

<div class="search-strip">
  <label class="search-bar">
    <input type="search" id="search-input" placeholder="農家名・作物・市町村で探す" />
  </label>
</div>
<p class="result-count" id="result-count" aria-live="polite"></p>

<main class="container wide" style="padding-top:16px;">
  <div class="tabs" id="municipality-tabs"></div>
  <div id="content">
    <div class="skeleton-grid" style="padding:20px 0;"></div>
  </div>
</main>

<script src="/common.js"></script>
<script>
let allFarmers = [];
let currentMunicipality = "";
let searchQuery = "";

document.querySelector("#content .skeleton-grid").innerHTML = skeletonCards(8);

async function load() {
  const content = document.getElementById("content");
  try {
    const data = await apiFetch("/api/farmers");
    allFarmers = data.farmers || [];
    renderTabs();
    render();
  } catch (e) {
    content.innerHTML = `<div class="error-message">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTabs() {
  const tabsEl = document.getElementById("municipality-tabs");
  const municipalities = Array.from(new Set(allFarmers.map((f) => f.municipality)));
  const tabs = ["すべて", ...municipalities];
  tabsEl.innerHTML = tabs
    .map((m) => {
      const value = m === "すべて" ? "" : m;
      const active = value === currentMunicipality ? "active" : "";
      return `<button class="tab ${active}" data-value="${escapeHtml(value)}">${escapeHtml(m)}</button>`;
    })
    .join("");
  tabsEl.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentMunicipality = btn.dataset.value;
      renderTabs();
      render();
    });
  });
}

function render() {
  const content = document.getElementById("content");
  let filtered = currentMunicipality ? allFarmers.filter((f) => f.municipality === currentMunicipality) : allFarmers;
  const q = searchQuery;
  if (q) {
    filtered = filtered.filter(
      (f) =>
        (f.name || "").toLowerCase().includes(q) ||
        (f.crops || "").toLowerCase().includes(q) ||
        (f.municipality || "").toLowerCase().includes(q)
    );
  }
  document.getElementById("result-count").textContent = q ? `「${q}」の検索結果: ${filtered.length}件` : "";

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-state">${q ? "該当する農家が見つかりません。" : "この地域の登録農家はまだありません。"}</div>`;
    return;
  }
  content.innerHTML = `<div class="farmer-list">${filtered.map(renderCard).join("")}</div>`;
}

function renderCard(f) {
  const thumbStyle = f.cover_image_url ? `style="background-image:url('${escapeHtml(f.cover_image_url)}')"` : "";
  const badges = [];
  if (f.has_listing_today) badges.push(`<span class="badge">本日出品あり</span>`);
  if (f.next_event_date) badges.push(`<span class="badge event">${formatDateShort(f.next_event_date)} イベント</span>`);
  return `
    <a class="farmer-card" href="/farmer.html?id=${encodeURIComponent(f.id)}">
      <div class="thumb" role="img" aria-label="${escapeHtml(f.name)}の写真" ${thumbStyle}></div>
      <div class="info">
        <p class="name">${escapeHtml(f.name)}</p>
        <p class="location">${escapeHtml(f.municipality)}</p>
        <p class="crops">${escapeHtml(f.crops)}</p>
        <div class="badges">${badges.join("")}</div>
      </div>
    </a>
  `;
}

document.getElementById("search-input").addEventListener("input", (ev) => {
  searchQuery = ev.target.value.trim().toLowerCase();
  render();
});

initBottomNav(null);
load();
</script>
</body>
</html>
