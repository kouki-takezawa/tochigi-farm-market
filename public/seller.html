<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出品者ページ | 栃木の直売マルシェ</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <p class="app-title">出品者ページ</p>
  <p class="app-tagline">農家の方はこちらから出品・イベントを管理します</p>
</header>

<div class="container" id="page" style="padding-top:16px;"></div>

<script src="/common.js"></script>
<script>
const LOGIN_CODE = "0000"; // 仮の簡易ログイン。今後メールアドレスでのアカウント作成に置き換え予定

function render() {
  const page = document.getElementById("page");
  if (!isSellerLoggedIn()) {
    page.innerHTML = `
      <div class="card">
        <h3>出品者ログイン</h3>
        <p style="font-size:13px;color:var(--muted);">
          現在は簡易ログインです(今後メールアドレスでのアカウント作成に対応予定)。
          ログインコードは運営者からお知らせします。
        </p>
        <form id="login-form" class="stack">
          <input type="password" inputmode="numeric" name="code" placeholder="ログインコード" required />
          <button type="submit" class="btn primary block">ログイン</button>
        </form>
      </div>
    `;
    document.getElementById("login-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const code = new FormData(ev.target).get("code").trim();
      if (code === LOGIN_CODE) {
        localStorage.setItem("seller_logged_in", "1");
        showToast("ログインしました");
        render();
      } else {
        showToast("ログインコードが違います");
      }
    });
    return;
  }

  page.innerHTML = `
    <div class="card">
      <h3>出品者ページ(開発中)</h3>
      <p style="font-size:14px;">
        現在、出品者ごとのアカウント機能は開発中です。<br>
        今のところ、出品・イベントの投稿は運営者から発行された「管理用URL」から行えます。
        LINE等で届いた管理用URLをブックマークしてお使いください。
      </p>
    </div>

    <div class="card">
      <h3>管理用URLをお持ちの方</h3>
      <p style="font-size:13px;color:var(--muted);">届いた管理用URLをそのまま貼り付けると、出品・編集画面に移動できます。</p>
      <form id="jump-form" class="stack">
        <input type="text" name="url" placeholder="https://.../post.html?farmer=...&token=..." required />
        <button type="submit" class="btn primary block">開く</button>
      </form>
    </div>

    <div class="card">
      <h3>管理用URLをまだお持ちでない方</h3>
      <p style="font-size:13px;">運営者にご連絡ください。農家情報を確認のうえ、専用の管理URLを発行します。</p>
    </div>

    <button id="logout-btn" class="btn secondary block">ログアウト</button>
  `;

  document.getElementById("jump-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const raw = new FormData(ev.target).get("url").trim();
    try {
      const url = new URL(raw, location.origin);
      if (!url.pathname.endsWith("post.html") || !url.searchParams.get("farmer") || !url.searchParams.get("token")) {
        throw new Error("invalid");
      }
      location.href = url.pathname + url.search;
    } catch (e) {
      showToast("URLの形式が正しくありません");
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem("seller_logged_in");
    render();
  });
}

initNav("/seller.html");
render();
</script>
</body>
</html>
