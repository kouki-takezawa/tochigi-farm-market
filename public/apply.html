<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>掲載のお申し込み | とれたて便</title>
<meta name="description" content="とれたて便への掲載をご希望の農家の方は、こちらのフォームからお申し込みください。運営者が内容を確認のうえ、管理用URLをお送りします。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="site-nav">
  <a href="/" class="site-logo">とれたて便</a>
  <nav class="site-nav-links">
    <a href="/">ホーム</a>
    <a href="/listings.html">出品一覧</a>
    <a href="/farmers.html">農家一覧</a>
    <a href="/map.html">マップ</a>
    <a href="/events.html">イベント</a>
    <a href="/jobs.html">バイト求人</a>
  </nav>
  <a href="/seller.html" class="site-nav-cta">出品者ログイン</a>
</header>

<div class="page-title-strip">
  <h1>掲載のお申し込み</h1>
  <p>出品・イベント・求人の掲載はすべて無料です。内容を確認のうえ、運営者が承認すると管理用URLをお送りします。</p>
</div>

<div class="container" id="page" style="padding-top:16px;"></div>

<script src="/common.js"></script>
<script>
function renderForm() {
  const page = document.getElementById("page");
  page.innerHTML = `
    <div class="card">
      <h3>お申し込みフォーム</h3>
      <p class="field-help" style="margin-top:-6px;margin-bottom:14px;">
        送信後、運営者が内容を確認します。承認されると、出品・イベントの投稿に使う管理用URLを
        入力いただいた連絡先にお送りします(審査には数日かかる場合があります)。
      </p>
      <form id="apply-form" class="stack">
        <div><label>農家名(屋号・お名前)</label><input type="text" name="name" required /></div>
        <div>
          <label>都道府県</label>
          <select name="prefecture" required><option value="">選択してください</option>${prefectureOptionsHtml("")}</select>
        </div>
        <div><label>所在地(市町村)</label><input type="text" name="municipality" required placeholder="例: 宇都宮市" /></div>
        <div><label>作っているもの(任意)</label><input type="text" name="crops" placeholder="例: トマト・きゅうり" /></div>
        <div><label>紹介文(任意)</label><textarea name="description" placeholder="こだわりや農園の様子など"></textarea></div>
        <div>
          <label>連絡方法</label>
          <select name="contact_method" required>
            <option value="">選択してください</option>
            <option value="line">LINE</option>
            <option value="phone">電話</option>
            <option value="email">メール</option>
          </select>
        </div>
        <div>
          <label>連絡先</label>
          <input type="text" name="contact_value" required placeholder="LINE公式URL・電話番号・メールアドレスのいずれか" />
        </div>
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit" class="btn primary block">申し込む</button>
      </form>
    </div>
    <div class="card">
      <h3>すでに管理用URLをお持ちの方へ</h3>
      <p style="font-size:13px;color:var(--ink-2);">届いている管理用URLをそのまま開けば、出品・編集ができます。URLが分からない場合は<a href="/seller.html">出品者ログイン</a>からもご案内しています。</p>
    </div>
  `;

  document.getElementById("apply-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const form = ev.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      const fd = new FormData(form);
      await apiFetch("/api/applications", {
        method: "POST",
        body: JSON.stringify({
          name: fd.get("name"),
          prefecture: fd.get("prefecture"),
          municipality: fd.get("municipality"),
          crops: fd.get("crops") || "",
          description: fd.get("description") || "",
          contact_method: fd.get("contact_method"),
          contact_value: fd.get("contact_value"),
          website: fd.get("website") || "",
        }),
      });
      renderDone();
    } catch (e) {
      showToast(e.message);
      submitBtn.disabled = false;
    }
  });
}

function renderDone() {
  document.getElementById("page").innerHTML = `
    <div class="card">
      <h3>お申し込みを受け付けました</h3>
      <p style="font-size:14px;line-height:1.9;">
        ご申請ありがとうございます。運営者が内容を確認し、承認され次第、出品・イベントの投稿に使う
        管理用URLをご連絡先にお送りします。今しばらくお待ちください。
      </p>
      <a class="btn secondary block" href="/" style="margin-top:14px;">トップへ戻る</a>
    </div>
  `;
}

initBottomNav(null);
renderForm();
initSiteFooter();
</script>
</body>
</html>
